<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
    <linearGradient id="p-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2030" />
      <stop offset="100%" stop-color="#141926" />
    </linearGradient>
    <linearGradient id="p-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79A9FF" />
      <stop offset="100%" stop-color="#A7C5FF" />
    </linearGradient>
    <linearGradient id="p-avatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A538C" />
      <stop offset="100%" stop-color="#1F2A48" />
    </linearGradient>
    <filter id="p-shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="380" height="780" rx="36" fill="url(#p-bg)" />
  <rect x="2" y="2" width="376" height="776" rx="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Status Bar -->
  <text x="28" y="28" fill="#F5F7FA" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600">9:41</text>
  <circle cx="190" cy="24" r="5" fill="#05070B" />
  <g transform="translate(315, 18)" fill="#F5F7FA">
    <!-- Signal -->
    <rect x="0" y="6" width="2.5" height="4" rx="0.5" />
    <rect x="4" y="4" width="2.5" height="6" rx="0.5" />
    <rect x="8" y="2" width="2.5" height="8" rx="0.5" />
    <rect x="12" y="0" width="2.5" height="10" rx="0.5" />
    <!-- Battery -->
    <rect x="22" y="1" width="16" height="8.5" rx="2" fill="none" stroke="#F5F7FA" stroke-width="1.2" />
    <rect x="24" y="3" width="11" height="4.5" rx="1" fill="#79A9FF" />
    <rect x="38.5" y="3.5" width="1.5" height="3.5" rx="0.5" />
  </g>

  <!-- App Header -->
  <g transform="translate(20, 52)">
    <text x="0" y="20" fill="#F5F7FA" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="700">My Profile</text>
    <!-- Edit Icon Button -->
    <rect x="296" y="0" width="40" height="28" rx="14" fill="#171C27" stroke="rgba(255,255,255,0.1)" />
    <text x="316" y="18" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Edit</text>
  </g>

  <!-- Profile Card -->
  <g transform="translate(20, 96)" filter="url(#p-shadow)">
    <rect width="340" height="174" rx="20" fill="url(#p-card)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Avatar -->
    <rect x="18" y="18" width="60" height="60" rx="30" fill="url(#p-avatar)" stroke="#79A9FF" stroke-width="2" />
    <text x="48" y="55" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700" text-anchor="middle">PS</text>
    <!-- Verified Badge -->
    <circle cx="70" cy="70" r="8" fill="#79A9FF" />
    <path d="M66.5 70 L69 72.5 L73.5 67.5" fill="none" stroke="#0B0D12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Name & Title -->
    <text x="92" y="38" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700">Priya Sharma</text>
    <text x="92" y="56" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">Product Designer · Founder</text>
    <text x="92" y="72" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Studio One · San Francisco</text>

    <!-- Bio snippet -->
    <text x="18" y="106" fill="#CED3DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" line-height="1.4">
      Designing minimalist digital identity platforms.
    </text>
    <text x="18" y="122" fill="#CED3DC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      Obsessed with typography &amp; frictionless connections.
    </text>

    <!-- Quick Share CTA -->
    <rect x="18" y="136" width="304" height="28" rx="8" fill="#79A9FF" fill-opacity="0.12" stroke="#79A9FF" stroke-opacity="0.3" />
    <text x="170" y="154" fill="#A7C5FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Universal vCard 3.0 Active · Tap to Share</text>
  </g>

  <!-- Contact Details Section -->
  <g transform="translate(20, 286)">
    <text x="4" y="0" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1">CONTACT DETAILS</text>

    <!-- Row 1: Phone -->
    <g transform="translate(0, 12)">
      <rect width="340" height="46" rx="12" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="24" cy="23" r="13" fill="#1C2436" />
      <path d="M20 18 C20 18 20 23 24 27 C28 31 33 31 33 31 L30.5 28.5 L28 29 L26 27 L24 25 L24.5 22.5 Z" fill="#79A9FF" />
      <text x="48" y="20" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Mobile Phone</text>
      <text x="48" y="34" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">+1 (415) 890-4211</text>
      <text x="320" y="28" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">Primary</text>
    </g>

    <!-- Row 2: Email -->
    <g transform="translate(0, 64)">
      <rect width="340" height="46" rx="12" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="24" cy="23" r="13" fill="#1C2436" />
      <rect x="17" y="17" width="14" height="11" rx="1.5" fill="none" stroke="#79A9FF" stroke-width="1.3" />
      <path d="M17 19 L24 24 L31 19" fill="none" stroke="#79A9FF" stroke-width="1.3" />
      <text x="48" y="20" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Email Address</text>
      <text x="48" y="34" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">priya@onevocontact.com</text>
      <circle cx="316" cy="23" r="3.5" fill="#2ECC71" />
    </g>

    <!-- Row 3: Website -->
    <g transform="translate(0, 116)">
      <rect width="340" height="46" rx="12" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="24" cy="23" r="13" fill="#1C2436" />
      <circle cx="24" cy="23" r="6.5" fill="none" stroke="#79A9FF" stroke-width="1.3" />
      <path d="M17.5 23 L30.5 23 M24 16.5 C26 18.5 27 21 27 23 C27 25 26 27.5 24 29.5 C22 27.5 21 25 21 23 C21 21 22 18.5 24 16.5 Z" fill="none" stroke="#79A9FF" stroke-width="1" />
      <text x="48" y="20" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5">Personal Site</text>
      <text x="48" y="34" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600">priyasharma.design</text>
      <text x="320" y="28" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">Visit ↗</text>
    </g>
  </g>

  <!-- Linked Accounts Section -->
  <g transform="translate(20, 480)">
    <text x="4" y="0" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1">LINKED ACCOUNTS</text>
    
    <!-- Account Badges Grid -->
    <g transform="translate(0, 12)">
      <!-- WhatsApp -->
      <rect x="0" y="0" width="106" height="40" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="18" cy="20" r="9" fill="#25D366" fill-opacity="0.15" />
      <text x="18" y="24" fill="#25D366" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">WA</text>
      <text x="34" y="18" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">WhatsApp</text>
      <text x="34" y="29" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Included</text>

      <!-- LinkedIn -->
      <rect x="116" y="0" width="106" height="40" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="134" cy="20" r="9" fill="#0A66C2" fill-opacity="0.2" />
      <text x="134" y="24" fill="#0A66C2" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">in</text>
      <text x="150" y="18" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">LinkedIn</text>
      <text x="150" y="29" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Included</text>

      <!-- GitHub -->
      <rect x="232" y="0" width="108" height="40" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="250" cy="20" r="9" fill="#FFFFFF" fill-opacity="0.1" />
      <text x="250" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GH</text>
      <text x="266" y="18" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">GitHub</text>
      <text x="266" y="29" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Included</text>

      <!-- Row 2 -->
      <!-- X / Twitter -->
      <rect x="0" y="48" width="106" height="40" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="18" cy="68" r="9" fill="#FFFFFF" fill-opacity="0.1" />
      <text x="18" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">𝕏</text>
      <text x="34" y="66" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Twitter / 𝕏</text>
      <text x="34" y="77" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Included</text>

      <!-- Instagram -->
      <rect x="116" y="48" width="106" height="40" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" />
      <circle cx="134" cy="68" r="9" fill="#E1306C" fill-opacity="0.2" />
      <text x="134" y="72" fill="#E1306C" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">IG</text>
      <text x="150" y="66" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Instagram</text>
      <text x="150" y="77" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Included</text>

      <!-- Add Link -->
      <rect x="232" y="48" width="108" height="40" rx="10" fill="#141926" stroke="dashed rgba(121,169,255,0.4)" stroke-width="1" />
      <text x="286" y="72" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add Link</text>
    </g>
  </g>

  <!-- Big Floating Action Button -->
  <g transform="translate(30, 638)">
    <rect width="320" height="46" rx="23" fill="url(#p-accent)" filter="url(#p-shadow)" />
    <!-- QR Mini Icon -->
    <path d="M124 23 M120 18 H128 V26 H120 Z M122 20 H126 V24 H122 Z" fill="#0B0D12" stroke="#0B0D12" stroke-width="1.2" />
    <text x="160" y="28" fill="#0B0D12" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">View My Profile QR</text>
  </g>

  <!-- Android System Navigation -->
  <g transform="translate(0, 716)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="rgba(255,255,255,0.06)" />
    <!-- Bottom Nav Items -->
    <!-- Home -->
    <g transform="translate(48, 16)">
      <circle cx="10" cy="10" r="2.5" fill="#A0A8B7" />
      <text x="10" y="24" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Home</text>
    </g>
    <!-- People -->
    <g transform="translate(136, 16)">
      <circle cx="10" cy="10" r="2.5" fill="#A0A8B7" />
      <text x="10" y="24" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">People</text>
    </g>
    <!-- Scan -->
    <g transform="translate(224, 16)">
      <circle cx="10" cy="10" r="2.5" fill="#A0A8B7" />
      <text x="10" y="24" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Scan</text>
    </g>
    <!-- Profile (Active) -->
    <g transform="translate(312, 16)">
      <circle cx="10" cy="10" r="3.5" fill="#79A9FF" />
      <text x="10" y="24" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Profile</text>
    </g>
    <!-- Gesture Pill -->
    <rect x="150" y="48" width="80" height="3.5" rx="2" fill="rgba(255,255,255,0.3)" />
  </g>
</svg>
