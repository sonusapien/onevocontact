      <circle cx="28" cy="27" r="16" fill="#3D2952" />
      <text x="28" y="32" fill="#E8B4F8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MP</text>
      <text x="56" y="24" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Maya Patel</text>
      <text x="56" y="39" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">VP of Partnerships · Yesterday</text>
      <circle cx="312" cy="27" r="13" fill="#1B2234" />
      <path d="M309 24 C309 24 309 27 312 30 C315 33 318 33 318 33 L316 31 L314.5 31.5 L313 30 L311.5 28.5 L312 27 Z" fill="#79A9FF" />
    </g>

