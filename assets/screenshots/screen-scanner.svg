<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070A0F" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>
    <linearGradient id="sc-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(121, 169, 255, 0)" />
      <stop offset="50%" stop-color="rgba(121, 169, 255, 0.9)" />
      <stop offset="100%" stop-color="rgba(121, 169, 255, 0)" />
    </linearGradient>
    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="380" height="780" rx="36" fill="url(#sc-bg)" />
  <rect x="2" y="2" width="376" height="776" rx="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Status Bar -->
  <text x="28" y="28" fill="#F5F7FA" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600">9:41</text>
  <circle cx="190" cy="24" r="5" fill="#000000" />
  <g transform="translate(315, 18)" fill="#F5F7FA">
    <rect x="0" y="6" width="2.5" height="4" rx="0.5" />
    <rect x="4" y="4" width="2.5" height="6" rx="0.5" />
    <rect x="8" y="2" width="2.5" height="8" rx="0.5" />
    <rect x="12" y="0" width="2.5" height="10" rx="0.5" />
    <rect x="22" y="1" width="16" height="8.5" rx="2" fill="none" stroke="#F5F7FA" stroke-width="1.2" />
    <rect x="24" y="3" width="11" height="4.5" rx="1" fill="#79A9FF" />
    <rect x="38.5" y="3.5" width="1.5" height="3.5" rx="0.5" />
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 52)">
    <circle cx="14" cy="12" r="14" fill="rgba(255,255,255,0.15)" />
    <path d="M16 7 L11 12 L16 17" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <text x="40" y="17" fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="700">Scan QR Code</text>
    
    <!-- Flashlight icon -->
    <circle cx="280" cy="12" r="14" fill="rgba(255,255,255,0.15)" />
    <path d="M280 6 L277 12 H283 L280 18" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Gallery icon -->
    <circle cx="320" cy="12" r="14" fill="rgba(255,255,255,0.15)" />
    <rect x="314" y="7" width="12" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3" />
    <circle cx="317" cy="10" r="1" fill="#FFFFFF" />
  </g>

  <!-- Instructions text -->
  <text x="190" y="130" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Point camera at a ONEVO or vCard QR</text>
  <text x="190" y="148" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" text-anchor="middle">Align code inside the frame to scan automatically</text>

  <!-- Camera Viewfinder Reticle -->
  <g transform="translate(55, 175)">
    <!-- Scanned QR silhouette in background of camera -->
    <g opacity="0.35" transform="translate(45, 45)">
      <rect x="0" y="0" width="40" height="40" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <rect x="10" y="10" width="20" height="20" fill="#FFFFFF" />
      <rect x="140" y="0" width="40" height="40" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <rect x="150" y="10" width="20" height="20" fill="#FFFFFF" />
      <rect x="0" y="140" width="40" height="40" rx="6" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <rect x="10" y="150" width="20" height="20" fill="#FFFFFF" />
      <!-- Dots -->
      <rect x="60" y="10" width="16" height="16" fill="#FFFFFF" />
      <rect x="100" y="10" width="20" height="16" fill="#FFFFFF" />
      <rect x="60" y="50" width="30" height="20" fill="#FFFFFF" />
      <rect x="110" y="60" width="20" height="40" fill="#FFFFFF" />
      <rect x="60" y="130" width="40" height="20" fill="#FFFFFF" />
      <rect x="130" y="130" width="30" height="30" fill="#FFFFFF" />
    </g>

    <!-- 4 Glowing Corner Brackets of reticle -->
    <!-- Top Left -->
    <path d="M0 36 V12 C0 5.4 5.4 0 12 0 H36" fill="none" stroke="#79A9FF" stroke-width="4" stroke-linecap="round" filter="url(#sc-glow)" />
    <!-- Top Right -->
    <path d="M234 0 H258 C264.6 0 270 5.4 270 12 V36" fill="none" stroke="#79A9FF" stroke-width="4" stroke-linecap="round" filter="url(#sc-glow)" />
    <!-- Bottom Left -->
    <path d="M0 234 V258 C0 264.6 5.4 270 12 270 H36" fill="none" stroke="#79A9FF" stroke-width="4" stroke-linecap="round" filter="url(#sc-glow)" />
    <!-- Bottom Right -->
    <path d="M234 270 H258 C264.6 270 270 264.6 270 258 V234" fill="none" stroke="#79A9FF" stroke-width="4" stroke-linecap="round" filter="url(#sc-glow)" />

    <!-- Animated Laser Scan Line -->
    <rect x="4" y="125" width="262" height="3" fill="url(#sc-laser)" filter="url(#sc-glow)" />
  </g>

  <!-- Detected Contact Toast Banner -->
  <g transform="translate(20, 480)">
    <rect width="340" height="110" rx="18" fill="#141926" stroke="#79A9FF" stroke-width="1.5" />
    <circle cx="44" cy="55" r="24" fill="#3D2952" stroke="#E8B4F8" stroke-width="1.5" />
    <text x="44" y="62" fill="#E8B4F8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">MP</text>
    
    <text x="80" y="44" fill="#2ECC71" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">✓ CONTACT DETECTED</text>
    <text x="80" y="62" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Maya Patel</text>
    <text x="80" y="78" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">VP of Strategic Partnerships · Apex Labs</text>

    <!-- Instant Save action badge -->
    <rect x="250" y="32" width="76" height="46" rx="10" fill="#79A9FF" />
    <text x="288" y="52" fill="#0B0D12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">VIEW &amp;</text>
    <text x="288" y="66" fill="#0B0D12" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">SAVE ↗</text>
  </g>

  <!-- Bottom Helper info -->
  <g transform="translate(20, 616)">
    <rect width="340" height="60" rx="14" fill="#141926" stroke="rgba(255,255,255,0.06)" />
    <circle cx="28" cy="30" r="14" fill="#1C2436" />
    <text x="28" y="35" fill="#79A9FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">i</text>
    <text x="52" y="26" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Universal Format Support</text>
    <text x="52" y="42" fill="#A0A8B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Reads standard vCard 2.1, 3.0, 4.0, meCard, and plain text.</text>
  </g>

  <!-- Android System Navigation -->
  <g transform="translate(0, 716)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="rgba(255,255,255,0.06)" />
    <rect x="150" y="48" width="80" height="3.5" rx="2" fill="rgba(255,255,255,0.3)" />
  </g>
</svg>
