    <!-- Mini Avatar with initials -->
    <circle cx="38" cy="38" r="22" fill="#293962" stroke="#79A9FF" stroke-width="1.8" />
    <text x="38" y="45" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">PS</text>
    <circle cx="53" cy="53" r="5" fill="#2ECC71" />

    <text x="70" y="35" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Priya Sharma</text>
