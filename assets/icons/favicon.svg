<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="onevo-fav-grad" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6557FF" />
      <stop offset="100%" stop-color="#278BFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6557FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="48" height="48" rx="12" fill="#080D1D" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <!-- Central Emblem: Connected Nodes forming O -->
  <g filter="url(#glow)">
    <circle cx="24" cy="24" r="14" stroke="url(#onevo-fav-grad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="64 12" transform="rotate(-45 24 24)"/>
    <circle cx="24" cy="10" r="3.2" fill="#278BFF"/>
    <circle cx="24" cy="38" r="3.2" fill="#6557FF"/>
    <circle cx="24" cy="24" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>