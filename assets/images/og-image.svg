<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080D1D"/>
      <stop offset="50%" stop-color="#10182C"/>
      <stop offset="100%" stop-color="#080D1D"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="100" y1="100" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6557FF"/>
      <stop offset="100%" stop-color="#278BFF"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(101, 87, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(39, 139, 255, 0.4)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="626" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="280" cy="220" r="260" fill="#6557FF" opacity="0.12" filter="blur(80px)"/>
  <circle cx="950" cy="380" r="280" fill="#278BFF" opacity="0.1" filter="blur(90px)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <circle cx="36" cy="36" r="28" stroke="url(#brandGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="128 24" transform="rotate(-45 36 36)"/>
    <circle cx="36" cy="8" r="6" fill="#278BFF"/>
    <circle cx="36" cy="64" r="6" fill="#6557FF"/>
    <circle cx="36" cy="36" r="9" fill="#FFFFFF"/>
    <text x="90" y="48" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="6">ONEVO</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">One profile.</text>
  <text x="100" y="344" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Endless connections.</text>

  <!-- Tagline / Description -->
  <text x="100" y="420" fill="#AAB4C8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Digital identity &amp; proximity-powered contact sharing for Android.
  </text>
  <text x="100" y="460" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Official Public Launch Website • Direct APK Distribution
  </text>

  <!-- Phone Graphic Outline on Right -->
  <g transform="translate(820, 85)">
    <!-- Device Frame -->
    <rect width="280" height="480" rx="42" fill="#17223A" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>
    <rect x="8" y="8" width="264" height="464" rx="36" fill="#080D1D"/>
    <!-- Punch hole -->
    <circle cx="140" cy="24" r="5" fill="#000000"/>
    <!-- Inner Screen UI Cards -->
    <rect x="28" y="55" width="224" height="110" rx="16" fill="#10182C" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Avatar -->
    <circle cx="140" cy="95" r="22" fill="#6557FF"/>
    <rect x="85" y="130" width="110" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <rect x="100" y="145" width="80" height="6" rx="3" fill="#AAB4C8" opacity="0.6"/>

    <!-- Action pills -->
    <rect x="28" y="180" width="224" height="42" rx="10" fill="#6557FF" opacity="0.9"/>
    <rect x="28" y="235" width="224" height="42" rx="10" fill="#17223A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <rect x="28" y="290" width="224" height="42" rx="10" fill="#17223A" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- QR Mini preview -->
    <rect x="95" y="350" width="90" height="90" rx="12" fill="#FFFFFF"/>
    <rect x="105" y="360" width="30" height="30" fill="#080D1D"/>
    <rect x="145" y="360" width="30" height="30" fill="#080D1D"/>
    <rect x="105" y="400" width="30" height="30" fill="#080D1D"/>
  </g>
</svg>